else if(view=='chat'){const cid=[uid,chatId].sort().join('_'),nm=((chats.find(c=>c.id==cid)||{}).names||{})[chatId]||pname(chatId);a.innerHTML=`<div class=row style="margin-bottom:8px"><button class="btn sec" onclick="go('chats')">←</button><b>${esc(nm)}</b></div><div class=chat id=cl>${msgs.map(m=>`<div class="m ${m.f==uid?'me':''}">${esc(m.t)}<small>${esc(m.time)}</small></div>`).join('')}</div><div class=row style="margin-top:8px"><input id=ci placeholder="Type a message" value="${esc(draft)}" style="flex:1;margin:0" onkeydown="if(event.key=='Enter')send()"><button class=btn onclick="send()">Send</button></div>`;const c=$('cl');c.scrollTop=c.scrollHeight}
else if(view=='register'){a.innerHTML=`<div class=card><h3>Become an entrepreneur</h3><label>Business name</label><input id=bn><label>Products / services you offer</label><input id=bo><label>Category</label><select id=bc>${cats.map(c=>`<option>${c}</option>`).join('')}</select><label>WhatsApp business number</label><input id=bw type=tel placeholder="07XX XXX XXX"><label><input type=checkbox id=tc style="width:auto;margin:0 6px 0 0">I accept the <a href="#" onclick="go('terms');return false">Terms &amp; Conditions</a></label><br><br><button class=btn onclick="register()">Register</button> <button class="btn sec" onclick="go('browse')">Cancel</button></div>`}
else if(view=='shop'){const b=me.biz;a.innerHTML=card(ents().find(e=>e.id==uid)||{id:uid,username:me.username,name:b.name,offer:b.offer,cat:b.cat,wa:b.wa,products:[]})+`<div class=card><h3>Advertise a product</h3><label>Product name</label><input id=pn><label>Price (Ksh)</label><input id=pp type=number><label>Photo</label><input id=pi type=file accept="image/*"><label>Short video (max 500KB)</label><input id=pv type=file accept="video/*"><button class=btn onclick="addP()">Post</button></div><p class=mu>Daily fee (Ksh 10–20) will be added after testing.</p>`}
else if(view=='profile'){const b=me.biz;a.innerHTML=`<div class=card><h3>My profile</h3><label>Username</label><input id=pu value="${esc(me.username)}"><label>Mobile number</label><input id=pm value="${esc(me.phone)}"><label>Email (optional)</label><input id=pe value="${esc(me.email)}">${b?`<label>Business name</label><input id=pb value="${esc(b.name)}"><label>Products / services</label><input id=po value="${esc(b.offer)}"><label>Category</label><select id=pc>${cats.map(c=>`<option ${c==b.cat?'selected':''}>${c}</option>`).join('')}</select><label>WhatsApp business number</label><input id=pw value="${esc(b.wa)}">`:''}${ntog()}<button class=btn onclick="saveProfile()">Save</button></div><p class=mu>Note: you always log in with the username you signed up with.</p>`}
else if(view=='alerts'){const l=prods.filter(p=>p.uid!=uid).slice(0,20);a.innerHTML=`<div class=card><h3 style="margin:0">Alerts</h3>${ntog()}</div>`+(l.length?l.map(p=>{const u=users.find(x=>x.id==p.uid),nw=p.t>prevSeen;return `<div class=card onclick="go('home')" style="cursor:pointer"><div class=row><b style="flex:1">${esc(u&&u.biz?u.biz.name:'A seller')} posted ${esc(p.n)}</b>${nw?'<span class=tag>New</span>':''}</div><div class=mu>Ksh ${esc(p.p)} · ${new Date(p.t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`}).join(''):'<div class=card><p class=mu>No products yet. New ones will show here.</p></div>')}
else a.innerHTML=`<div class=card><h3>Terms &amp; Conditions</h3><ol><li>Only JOOUST students/staff may advertise as entrepreneurs.</li><li>Sell only legal, honest products and services; no fake or stolen goods.</li><li>Prices and photos must be accurate.</li><li>Deals and payments between clients and entrepreneurs are their own responsibility; meet in safe public places.</li><li>Clients use the app free. Entrepreneurs will pay Ksh 10–20 per day once billing starts.</li><li>No abuse, spam or harassment in chats. Accounts may be removed for breaking these rules.</li><li>Your WhatsApp number is shown publicly so clients can reach you.</li></ol></div><div class=card><h3>About</h3><p style="margin:0">JOOUST students run small businesses, from braiding and food to repairs and rentals, but many of them struggle to be found. Customers, in turn, waste time asking around for who sells what or where to find a good room near campus. JOOUST Hustle Hub puts student businesses and rentals in one place, where anyone can browse, chat or WhatsApp the seller directly, with no middleman. It was built by a JOOUST student to help fellow students earn, save time and trust who they deal with.</p></div>`+`<div class=card><h3>FAQs</h3><div class=faq><details><summary>What is JOOUST Hustle Hub?</summary><p>A place where students find student businesses and rentals, and chat or WhatsApp them directly. No middleman.</p></details><details><summary>Is it free?</summary><p>Yes for clients. Entrepreneurs will pay Ksh 10-20 per day once billing starts.</p></details><details><summary>How do I become an entrepreneur?</summary><p>Log in, open the You tab, choose Become an entrepreneur, then add your business name, what you offer and your WhatsApp number.</p></details><details><summary>How do I advertise a product?</summary><p>Open My shop, add the product name, price and a photo, then post it.</p></details><details><summary>How do I find a rental?</summary><p>Go to Search, open Rentals, and filter by type, rent or area. Tap WhatsApp or Chat to reach the landlord.</p></details><details><summary>How do I stay safe?</summary><p>Never pay before you see the item or house. Meet in public places. Use Report on anything fake or suspicious.</p></details><details><summary>Can I change my username?</summary><p>Yes, in the You tab. If the name is already used, you will be told it is taken.</p></details><details><summary>I forgot my password. What now?</summary><p>Password reset is not available yet. Keep your password safe, or create a new account with a new username.</p></details></div></div>`}
function go(x){if(x=='alerts'){prevSeen=seen;seen=Date.now();ls.s('jhh_seen',seen)}view=x;if(x!='rentals')showPost=false;render()}
function rcard(r){const mine=r.uid==uid;return `<div class=card><div class=row><b style="flex:1">${esc(r.title)}</b><span class=tag>${esc(r.type)}</span></div><div class=mu>${esc(r.area)} · Posted ${new Date(r.t).toLocaleDateString()}</div>`+(r.imgs||[]).map(i=>`<img src="${i}" alt="" loading=lazy decoding=async style="max-width:100%;max-height:220px;border-radius:8px;margin-top:6px">`).join('')+(r.vid?`<video src="${r.vid.replace('/upload/','/upload/q_auto,w_640/')}" controls playsinline preload=metadata style="max-width:100%;max-height:300px;border-radius:8px;margin-top:6px"></video>`:'')+`<p style="margin:8px 0"><b>Ksh ${esc(r.rent)}/month</b>${r.dep?` · Deposit Ksh ${esc(r.dep)}`:''}</p>${r.desc?`<div class=mu>${esc(r.desc)}</div>`:''}<div class=row style="margin-top:8px"><a class="btn wa" target=_blank rel=noopener href="https://wa.me/${wa(r.wa)}?text=${encodeURIComponent('Hi, I saw your rental "'+r.title+'" on JOOUST Hustle Hub. Is it still available?')}">WhatsApp</a>${mine?`<button class="btn sec" onclick="delR('${r.id}')">Delete</button>`:`<button class="btn sec" onclick="openChat('${r.uid}')">Chat</button><button class="btn sec" onclick="repR('${r.id}')">Report</button>`}</div></div>`}
function vdur(f){return new Promise((res,rej)=>{const e=document.createElement('video');e.preload='metadata';e.onloadedmetadata=()=>{URL.revokeObjectURL(e.src);res(e.duration)};e.onerror=()=>rej(new Error('Cannot read this video file.'));e.src=URL.createObjectURL(f)})}
async function upVid(f){if(f.size>80e6)throw new Error('Video too big (max 80MB). Record in lower quality or trim it.');const du=await vdur(f);if(du>62)throw new Error('Video is longer than 1 minute. Please trim it.');return new Promise((res,rej)=>{const x=new XMLHttpRequest(),fd=new FormData();fd.append('file',f);fd.append('upload_preset',CLD.preset);x.open('POST','https://api.cloudinary.com/v1_1/'+CLD.cloud+'/video/upload');x.upload.onprogress=e=>{const u=$('rup');if(u&&e.lengthComputable)u.textContent='Uploading video… '+Math.round(e.loaded/e.total*100)+'%'};x.onload=()=>{try{const j=JSON.parse(x.responseText);j.secure_url?res(j.secure_url):rej(new Error((j.error&&j.error.message)||'Video upload failed'))}catch(e){rej(new Error('Video upload failed'))}};x.onerror=()=>rej(new Error('Video upload failed. Check your internet.'));x.send(fd)})}
function startPost(){if(!need())return;showPost=true;render()}
async function postRental(){if(!uid)return;const t=v('rtl'),ar=v('rar'),re=+v('rre');if(!t||!ar||!re)return alert('Add a title, area and monthly rent.');if(wa(v('rwa')).length<11)return alert('Enter a valid WhatsApp number.');const d={uid,by:me.username,title:t,area:ar,type:v('rty'),rent:re,wa:v('rwa'),desc:v('rds'),t:Date.now()},de=+v('rde');if(de)d.dep=de;const fs=[...$('rfi').files].slice(0,3);d.imgs=[];for(const f of fs)d.imgs.push(await img(f));const fv=vok&&$('rvi')&&$('rvi').files[0];try{if(fv){d.vid=await upVid(fv)}await db.collection('rentals').add(d);showPost=false;render()}catch(e){alert(fe(e))}}
async function delR(id){if(await ask('Delete this rental?'))db.collection('rentals').doc(id).delete().then(()=>alert('Deleted successfully')).catch(e=>alert(fe(e)))}
async function repR(id){if(!need())return;if(await ask('Report this listing as fake or wrong?'))db.collection('reports').add({rid:id,by:uid,t:Date.now()}).then(()=>alert('Reported. Thank you, we will check it.')).catch(e=>alert(fe(e)))}
const pname=id=>((ents().find(x=>x.id==id)||{}).name)||((rentals.find(r=>r.uid==id)||{}).by)||'Chat';

window.alert=m=>{let t=$('tst');if(!t){t=document.createElement('div');t.id='tst';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',3500)};
const fe=e=>e&&e.code=='permission-denied'?'You are not allowed to do that.':e&&e.code=='unavailable'?'No internet connection. Try again.':'Something went wrong. Try again.';
const ask=m=>new Promise(r=>{const d=document.createElement('div');d.id='ask';d.innerHTML='<div><p></p><button class=btn id=ay>Yes</button><button id=an>Cancel</button></div>';d.querySelector('p').textContent=m;document.body.appendChild(d);const x=v=>{d.remove();r(v)};d.querySelector('#ay').onclick=()=>x(true);d.querySelector('#an').onclick=()=>x(false);d.onclick=e=>{if(e.target==d)x(false)}});
var ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
var sessionStart=Date.now(),fp=true,prevSeen=0,seen=+ls.g('jhh_seen')||0;if(!seen){seen=Date.now();ls.s('jhh_seen',seen)}
function nOn(){return ls.g('jhh_notif')!='0'}
function nbadge(){const b=$('nb');if(!b)return;const n=nOn()&&view!='alerts'?prods.filter(p=>p.uid!=uid&&p.t>seen).length:0;b.hidden=!n}
function setN(on){ls.s('jhh_notif',on?'1':'0');if(on&&'Notification' in window&&Notification.permission=='default')Notification.requestPermission();alert(on?'Notifications turned on':'Notifications turned off');render()}
function pn(d){const u=users.find(x=>x.id==d.uid),m=(u&&u.biz?u.biz.name:'A seller')+' posted '+d.n;if(document.hidden){if('Notification' in window&&Notification.permission=='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('JOOUST Hustle Hub',{body:m,icon:'icon-192.png',badge:'icon-192.png',tag:'newprod'}))}else if(view!='alerts')alert(m)}
const ntog=()=>`<label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type=checkbox style="width:auto;margin:0" ${nOn()?'checked':''} onchange="setN(this.checked)">Notify me when a product is posted</label>`;
const hx=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)))].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);
const mail=async x=>'u'+await hx(x)+'@jooust.app';
const taken=async(x,own)=>(await db.collection('users').where('username','==',x).limit(2).get()).docs.some(d=>d.id!=own);
const emsg=(e,u)=>({'auth/email-already-in-use':'"'+u+'" is taken. Try another username.','auth/weak-password':'Password must be at least 6 characters.','auth/network-request-failed':'No internet connection. Try again.','auth/too-many-requests':'Too many attempts. Wait a minute and try again.','auth/user-not-found':'Wrong username or password.','auth/wrong-password':'Wrong username or password.','auth/invalid-credential':'Wrong username or password.','auth/invalid-login-credentials':'Wrong username or password.'}[e.code]||'Something went wrong. Try again.');
async function doAuth(){const u=v('au').toLowerCase(),p=$('ap').value;if(!u)return alert('Enter a username.');if(p.length<6)return alert('Password must be at least 6 characters.');if(authM=='up'){if($('ap2').value!=p)return alert('Passwords do not match.');if(v('am')&&wa(v('am')).length<11)return alert('Enter a valid mobile number.');if(!$('atc').checked)return alert('Please accept the Terms & Conditions.')}const ph=authM=='up'?v('am'):'',em=authM=='up'?v('ae'):'';try{if(authM=='up'){if(await taken(u))return alert('"'+u+'" is taken. Try another username.');const r=await auth.createUserWithEmailAndPassword(await mail(u),p);await db.collection('users').doc(r.user.uid).set({username:u,phone:ph,email:em,mode:'client',biz:null})}else{try{await auth.signInWithEmailAndPassword(await mail(u),p)}catch(e){if(/^[a-z0-9_]{1,40}$/.test(u)&&['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(e.code))await auth.signInWithEmailAndPassword(u+'@jooust.app',p);else throw e}}view='browse'}catch(e){alert(emsg(e,u))}}
function toggleMode(){if(!need())return;if(isEnt()){db.collection('users').doc(uid).update({mode:'client'});if(view=='shop')view='browse'}else if(me.biz)db.collection('users').doc(uid).update({mode:'entrepreneur'});else go('register')}
function register(){const n=v('bn'),o=v('bo'),w=v('bw');if(!n||!o||wa(w).length<11)return alert('Fill in business name, offering and a valid WhatsApp number.');if(!$('tc').checked)return alert('Please accept the Terms & Conditions.');db.collection('users').doc(uid).update({mode:'entrepreneur',biz:{name:n,offer:o,cat:v('bc'),wa:w}}).then(()=>go('shop'))}
async function saveProfile(){const nu=v('pu').toLowerCase();if(!nu)return alert('Username required');if(nu!=me.username&&await taken(nu,uid))return alert('"'+nu+'" is taken. Try another username.');const d={username:nu,phone:v('pm'),email:v('pe')};if(me.biz){d['biz.name']=v('pb')||me.biz.name;d['biz.offer']=v('po');d['biz.cat']=v('pc');d['biz.wa']=v('pw')||me.biz.wa}db.collection('users').doc(uid).update(d).then(()=>alert('Saved successfully'))}
function openChat(id,h){if(!need())return;chatId=id;draft=h?'Hi, I would like to hire you / order: ':'';msgs=[];unM&&unM();unM=db.collection('chats').doc([uid,id].sort().join('_')).collection('m').orderBy('ts').onSnapshot(s=>{msgs=s.docs.map(d=>d.data());if(view=='chat'){const i=$('ci');if(i)draft=i.value;render();$('ci').focus()}},()=>{});view='chat';render()}
async function send(){const t=v('ci');if(!t)return;draft='';const cid=[uid,chatId].sort().join('_'),e=ents().find(x=>x.id==chatId),time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),ref=db.collection('chats').doc(cid);try{await ref.set({users:[uid,chatId],names:{[uid]:me.username,[chatId]:pname(chatId)},last:t,ts:Date.now()},{merge:true});await ref.collection('m').add({f:uid,t,time,ts:Date.now()})}catch(x){alert(x.message)}}
function img(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,480/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=fr.result};fr.readAsDataURL(f)})}
function vid(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
async function addP(){if(!isEnt())return;const n=v('pn'),p=v('pp');if(!n||!p)return alert('Add product name and price.');const d={uid,n,p:+p,t:Date.now()},fi=$('pi').files[0],fv=$('pv').files[0];if(fi)d.img=await img(fi);if(fv){if(fv.size>5e5)return alert('Video too big (max 500KB).');d.vid=await vid(fv)}try{await db.collection('products').add(d);render()}catch(e){alert(fe(e))}}
function delP(id){db.collection('products').doc(id).delete()}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').hidden=false});$('inst').onclick=()=>{dp.prompt();$('inst').hidden=true};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
