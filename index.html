<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOOUST Hustle Hub</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f7a4d"><link rel="icon" href="icon.svg"><style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#17211b;--mu:#66726b;--pr:#1f8a5b;--ac:#c0392b;--bd:#dde4e0;--me:#d6f2e3;--th:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0e1512;--card:#17211c;--tx:#e8f0ec;--mu:#8fa097;--pr:#35b97d;--ac:#ef6a5a;--bd:#2a3731;--me:#1d4d38;--th:#202c26;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{background:linear-gradient(120deg,#1f7a4d,#b3322f);color:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.hr{display:flex;gap:8px;align-items:center}.sb{margin:0;border-radius:20px;border:0;padding:10px 14px;background:#fff;color:#171b2e}
header h1{font-size:17px;margin:0;flex:1}header select,header button{border:0;border-radius:8px;padding:6px 8px;font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}nav button{flex:1;border:0;background:none;color:var(--mu);padding:13px 0;display:flex;justify-content:center}nav button.on{color:var(--ac)}nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:12px 12px 90px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}.tag{background:var(--bd);border-radius:6px;padding:1px 6px;font-size:11px}
input,textarea,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;text-decoration:none;cursor:pointer}.wa{background:#128c7e;color:#fff}.hire{background:var(--ac)}.sec{background:var(--bd);color:var(--tx)}
.prod{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--bd);padding:8px 0}.prod img,.prod video{max-width:100%;max-height:220px;border-radius:8px}
.chat{display:flex;flex-direction:column;gap:6px;min-height:50vh;max-height:60vh;overflow-y:auto;padding:8px;background:var(--bg);border-radius:10px}
.m{max-width:80%;padding:7px 10px;border-radius:12px;background:var(--th);align-self:flex-start;word-wrap:break-word}.m.me{background:var(--me);align-self:flex-end}.m small{display:block;color:var(--mu);font-size:10px;text-align:right}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head><body>
<header><div class=hr><h1>🎓 JOOUST Hustle Hub</h1><select id="th" onchange="theme(this.value)"><option value="default">Default</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="terms" onclick="go('terms')">Terms</button></div><div class=hr><button id="mode" onclick="toggleMode()"></button><button id="out" onclick="auth.signOut().then(()=>location.reload())" hidden>Log out</button><button id="inst" hidden>Install</button></div><input id="gs" class="sb" placeholder="🔍 Search skill, business or product…" oninput="q=this.value;render()"></header>
<main id="app"></main><nav id="nav"></nav>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id),v=id=>$(id).value.trim();
const cats=['Food','Fashion','Tech','Beauty','Services','Academic','Other'];
let T=localStorage.getItem('jhh-theme')||'default',view='home',cat='All',q='',draft='',authM='in',chatId=null,uid=null,me=null,users=[],prods=[],chats=[],msgs=[],unM=null;
const ok=typeof FB!='undefined'&&!FB.apiKey.startsWith('PASTE');let auth,db;
if(ok){firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore()}
function theme(x){if(x){T=x;localStorage.setItem('jhh-theme',x)}let t=T;if(t=='default')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;$('th').value=T}
const wa=n=>{n=String(n).replace(/\D/g,'');return n[0]=='0'?'254'+n.slice(1):n};
const isEnt=()=>me&&me.mode=='entrepreneur'&&me.biz;
const ents=()=>users.filter(u=>u.biz).map(u=>({id:u.id,username:u.username,name:u.biz.name,offer:u.biz.offer,cat:u.biz.cat,wa:u.biz.wa,products:prods.filter(p=>p.uid==u.id)}));
const need=()=>{if(uid)return true;view='auth';render();return false};
if(ok){
db.collection('users').where('biz','!=',null).onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));if(['home','browse','shop'].includes(view))render()});
db.collection('products').onSnapshot(s=>{prods=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);if(['home','browse','shop'].includes(view))render()});
auth.onAuthStateChanged(u=>{uid=u?u.uid:null;if(!u){me=null;return render()}
db.collection('users').doc(uid).onSnapshot(d=>{me=d.data()||null;if(view=='auth')view='browse';render()});
db.collection('chats').where('users','array-contains',uid).onSnapshot(s=>{chats=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));if(view=='chats')render()})})}
function card(e){const mine=e.id==uid;return `<div class=card><div class=row><b>${esc(e.name)}</b>${e.cat?'<span class=tag>'+esc(e.cat)+'</span>':''}</div><div class=mu>@${esc(e.username)} · ${esc(e.offer)}</div>`+(e.products||[]).map(p=>`<div class=prod>${p.img?`<img src="${p.img}" alt="">`:''}${p.vid?`<video src="${p.vid}" controls playsinline></video>`:''}<div class=row><span style="flex:1">${esc(p.n)}</span><b>Ksh ${esc(p.p)}</b>${mine&&view=='shop'?`<button class="btn sec" onclick="delP('${p.id}')">Delete</button>`:''}</div></div>`).join('')+`<div class=row style="margin-top:8px"><a class="btn wa" target=_blank rel=noopener href="https://wa.me/${wa(e.wa)}?text=${encodeURIComponent('Hi '+e.name+', I found you on JOOUST Hustle Hub')}">WhatsApp</a>${mine?'':`<button class="btn hire" onclick="openChat('${e.id}',1)">Hire</button><button class="btn sec" onclick="openChat('${e.id}')">Chat</button>`}</div></div>`}
function render(){theme();const a=$('app');$('gs').hidden=!(view=='home'||view=='browse');
if(!ok){$('nav').innerHTML='';a.innerHTML='<div class=card><h3>Setup needed</h3><p>Create config.js with your Firebase config.</p></div>';return}
$('mode').textContent=uid?(isEnt()?'Mode: Entrepreneur ⇄':'Mode: Client ⇄'):'Log in / Sign up';$('mode').onclick=uid?toggleMode:()=>{authM='in';view='auth';render()};$('out').hidden=!uid;
const IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',browse:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',chats:'<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/>',shop:'<path d="M4 8l1.5-4h13L20 8v2a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-6 0 2.5 2.5 0 0 1-5 0z"/><path d="M5 13v7h14v-7"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};
const tabs=['home','browse','chats',...(isEnt()?['shop']:[]),'profile'];
$('nav').innerHTML=tabs.map(t=>`<button class="${view==t||(t=='chats'&&view=='chat')?'on':''}" aria-label="${t}" onclick="go('${t}')"><svg viewBox="0 0 24 24">${IC[t]}</svg></button>`).join('');
if(['chats','chat','profile','shop','register'].includes(view)&&!uid)view='auth';
if(view=='auth'){a.innerHTML=`<div class=card><h3>${authM=='in'?'Log in':'Create account'}</h3><label>Username</label><input id=au autocapitalize=none><label>Password (6+ characters)</label><input id=ap type=password>${authM=='up'?'<label>Mobile number</label><input id=am type=tel><label>Email (optional)</label><input id=ae type=email>':''}<button class=btn onclick="doAuth()">${authM=='in'?'Log in':'Sign up'}</button> <button class="btn sec" onclick="authM=authM=='in'?'up':'in';render()">${authM=='in'?'New here? Sign up':'Have an account? Log in'}</button></div>`}
else if(uid&&!me)a.innerHTML='<p class=mu>Loading…</p>';
else if(view=='home'){const f=[];ents().forEach(e=>e.products.forEach(p=>f.push({...p,e})));f.sort((a,b)=>b.t-a.t);const s=q.toLowerCase(),g=f.filter(p=>!s||JSON.stringify([p.n,p.e.name,p.e.offer,p.e.cat]).toLowerCase().includes(s));a.innerHTML=g.length?g.map(p=>`<div class=card><div class=row><b>${esc(p.e.name)}</b><span class=tag>${esc(p.e.cat||'')}</span></div><div class=mu>@${esc(p.e.username)}</div><div class=prod style="border:0">${p.img?`<img src="${p.img}" alt="">`:''}${p.vid?`<video src="${p.vid}" controls playsinline></video>`:''}<div class=row><span style="flex:1">${esc(p.n)}</span><b>Ksh ${esc(p.p)}</b></div></div><div class=row><a class="btn wa" target=_blank rel=noopener href="https://wa.me/${wa(p.e.wa)}?text=${encodeURIComponent('Hi '+p.e.name+', I saw '+p.n+' on JOOUST Hustle Hub')}">WhatsApp</a>${p.e.id==uid?'':`<button class="btn hire" onclick="openChat('${p.e.id}',1)">Hire</button>`}</div></div>`).join(''):'<p class=mu>No posts yet. Entrepreneurs will appear here.</p>'}
else if(view=='browse'){const s=q.toLowerCase();a.innerHTML=`<div class=row style="margin-bottom:10px">`+['All',...cats].map(c=>`<button class="btn ${cat==c?'':'sec'}" onclick="cat='${c}';render()">${c}</button>`).join('')+`</div>`+(ents().filter(e=>(cat=='All'||e.cat==cat)&&(!s||JSON.stringify(e).toLowerCase().includes(s))).map(card).join('')||'<p class=mu>No entrepreneurs yet. Be the first!</p>')}
else if(view=='chats'){a.innerHTML=chats.length?chats.map(c=>{const o=c.users.find(x=>x!=uid);return `<div class=card onclick="openChat('${o}')" style="cursor:pointer"><b>${esc((c.names||{})[o]||'Chat')}</b><div class=mu>${esc(c.last||'')}</div></div>`}).join(''):'<p class=mu>No chats yet. Open an entrepreneur and tap Hire or Chat.</p>'}
else if(view=='chat'){const cid=[uid,chatId].sort().join('_'),nm=(ents().find(x=>x.id==chatId)||{}).name||((chats.find(c=>c.id==cid)||{}).names||{})[chatId]||'Chat';a.innerHTML=`<div class=row style="margin-bottom:8px"><button class="btn sec" onclick="go('chats')">←</button><b>${esc(nm)}</b></div><div class=chat id=cl>${msgs.map(m=>`<div class="m ${m.f==uid?'me':''}">${esc(m.t)}<small>${esc(m.time)}</small></div>`).join('')}</div><div class=row style="margin-top:8px"><input id=ci placeholder="Type a message" value="${esc(draft)}" style="flex:1;margin:0" onkeydown="if(event.key=='Enter')send()"><button class=btn onclick="send()">Send</button></div>`;const c=$('cl');c.scrollTop=c.scrollHeight}
else if(view=='register'){a.innerHTML=`<div class=card><h3>Become an entrepreneur</h3><label>Business name</label><input id=bn><label>Products / services you offer</label><input id=bo><label>Category</label><select id=bc>${cats.map(c=>`<option>${c}</option>`).join('')}</select><label>WhatsApp business number</label><input id=bw type=tel placeholder="07XX XXX XXX"><label><input type=checkbox id=tc style="width:auto;margin:0 6px 0 0">I accept the <a href="#" onclick="go('terms');return false">Terms &amp; Conditions</a></label><br><br><button class=btn onclick="register()">Register</button> <button class="btn sec" onclick="go('browse')">Cancel</button></div>`}
else if(view=='shop'){const b=me.biz;a.innerHTML=card(ents().find(e=>e.id==uid)||{id:uid,username:me.username,name:b.name,offer:b.offer,cat:b.cat,wa:b.wa,products:[]})+`<div class=card><h3>Advertise a product</h3><label>Product name</label><input id=pn><label>Price (Ksh)</label><input id=pp type=number><label>Photo</label><input id=pi type=file accept="image/*"><label>Short video (max 500KB)</label><input id=pv type=file accept="video/*"><button class=btn onclick="addP()">Post</button></div><p class=mu>Daily fee (Ksh 10–20) will be added after testing.</p>`}
else if(view=='profile'){const b=me.biz;a.innerHTML=`<div class=card><h3>My profile</h3><label>Username</label><input id=pu value="${esc(me.username)}"><label>Mobile number</label><input id=pm value="${esc(me.phone)}"><label>Email (optional)</label><input id=pe value="${esc(me.email)}">${b?`<label>Business name</label><input id=pb value="${esc(b.name)}"><label>Products / services</label><input id=po value="${esc(b.offer)}"><label>Category</label><select id=pc>${cats.map(c=>`<option ${c==b.cat?'selected':''}>${c}</option>`).join('')}</select><label>WhatsApp business number</label><input id=pw value="${esc(b.wa)}">`:''}<button class=btn onclick="saveProfile()">Save</button></div><p class=mu>Note: you always log in with the username you signed up with.</p>`}
else a.innerHTML=`<div class=card><h3>Terms &amp; Conditions</h3><ol><li>Only JOOUST students/staff may advertise as entrepreneurs.</li><li>Sell only legal, honest products and services; no fake or stolen goods.</li><li>Prices and photos must be accurate.</li><li>Deals and payments between clients and entrepreneurs are their own responsibility; meet in safe public places.</li><li>Clients use the app free. Entrepreneurs will pay Ksh 10–20 per day once billing starts.</li><li>No abuse, spam or harassment in chats. Accounts may be removed for breaking these rules.</li><li>Your WhatsApp number is shown publicly so clients can reach you.</li></ol></div>`}
function go(x){view=x;render()}
async function doAuth(){const u=v('au').toLowerCase(),p=$('ap').value;if(!/^[a-z0-9_]{3,20}$/.test(u))return alert('Username: 3-20 letters, numbers or _');if(p.length<6)return alert('Password needs 6+ characters');const ph=authM=='up'?v('am'):'',em=authM=='up'?v('ae'):'';try{if(authM=='up'){const r=await auth.createUserWithEmailAndPassword(u+'@jooust.app',p);await db.collection('users').doc(r.user.uid).set({username:u,phone:ph,email:em,mode:'client',biz:null})}else await auth.signInWithEmailAndPassword(u+'@jooust.app',p);view='browse'}catch(e){alert(e.message)}}
function toggleMode(){if(!need())return;if(isEnt()){db.collection('users').doc(uid).update({mode:'client'});if(view=='shop')view='browse'}else if(me.biz)db.collection('users').doc(uid).update({mode:'entrepreneur'});else go('register')}
function register(){const n=v('bn'),o=v('bo'),w=v('bw');if(!n||!o||wa(w).length<11)return alert('Fill in business name, offering and a valid WhatsApp number.');if(!$('tc').checked)return alert('Please accept the Terms & Conditions.');db.collection('users').doc(uid).update({mode:'entrepreneur',biz:{name:n,offer:o,cat:v('bc'),wa:w}}).then(()=>go('shop'))}
function saveProfile(){if(!v('pu'))return alert('Username required');const d={username:v('pu'),phone:v('pm'),email:v('pe')};if(me.biz){d['biz.name']=v('pb')||me.biz.name;d['biz.offer']=v('po');d['biz.cat']=v('pc');d['biz.wa']=v('pw')||me.biz.wa}db.collection('users').doc(uid).update(d).then(()=>alert('Saved'))}
function openChat(id,h){if(!need())return;chatId=id;draft=h?'Hi, I would like to hire you / order: ':'';msgs=[];unM&&unM();unM=db.collection('chats').doc([uid,id].sort().join('_')).collection('m').orderBy('ts').onSnapshot(s=>{msgs=s.docs.map(d=>d.data());if(view=='chat'){const i=$('ci');if(i)draft=i.value;render();$('ci').focus()}},()=>{});view='chat';render()}
async function send(){const t=v('ci');if(!t)return;draft='';const cid=[uid,chatId].sort().join('_'),e=ents().find(x=>x.id==chatId),time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),ref=db.collection('chats').doc(cid);try{await ref.set({users:[uid,chatId],names:{[uid]:me.username,[chatId]:e?e.name:'Chat'},last:t,ts:Date.now()},{merge:true});await ref.collection('m').add({f:uid,t,time,ts:Date.now()})}catch(x){alert(x.message)}}
function img(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,480/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=fr.result};fr.readAsDataURL(f)})}
function vid(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
async function addP(){if(!isEnt())return;const n=v('pn'),p=v('pp');if(!n||!p)return alert('Add product name and price.');const d={uid,n,p:+p,t:Date.now()},fi=$('pi').files[0],fv=$('pv').files[0];if(fi)d.img=await img(fi);if(fv){if(fv.size>5e5)return alert('Video too big (max 500KB).');d.vid=await vid(fv)}try{await db.collection('products').add(d);render()}catch(e){alert(e.message)}}
function delP(id){db.collection('products').doc(id).delete()}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').hidden=false});$('inst').onclick=()=>{dp.prompt();$('inst').hidden=true};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
